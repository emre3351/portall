<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ NİSA'NIN ÖZEL PORTALI 💖</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg-day: linear-gradient(-45deg, #ff9a9e, #fad0c4, #ffd1ff, #a1c4fd);
            --bg-night: linear-gradient(-45deg, #2c3e50, #4b0082, #000033, #1a1a2e);
            --card-light: rgba(255, 255, 255, 0.9);
            --card-dark: rgba(30, 30, 50, 0.85);
            --text-day: #4a4a4a;
            --text-night: #e0e0e0;
            --accent: #d63384;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            transition: 1.5s all ease; /* Gece-gündüz geçiş yumuşaklığı */
            text-align: center;
        }

        /* Gündüz ve Gece Sınıfları */
        body.day-mode { background: var(--bg-day); background-size: 400% 400%; animation: gradientBG 15s ease infinite; color: var(--text-day); }
        body.night-mode { background: var(--bg-night); background-size: 400% 400%; animation: gradientBG 15s ease infinite; color: var(--text-night); }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .portal-container {
            backdrop-filter: blur(15px);
            border-radius: 35px;
            padding: 40px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.2);
            max-width: 480px;
            width: 90%;
            border: 2px solid rgba(255,255,255,0.3);
        }

        .day-mode .portal-container { background: var(--card-light); }
        .night-mode .portal-container { background: var(--card-dark); border-color: rgba(255,255,255,0.1); }

        h1 { font-size: 2.2rem; margin-bottom: 10px; color: var(--accent); }
        .night-mode h1 { color: #bb86fc; }

        #message-box {
            font-size: 1.3rem;
            padding: 25px;
            border-radius: 20px;
            margin: 20px 0;
            cursor: pointer;
            transition: 0.3s;
            background: rgba(255,255,255,0.2);
        }

        .refresh-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: 0.3s;
        }

        .refresh-btn:hover { transform: scale(1.05); }

        .feature-box {
            margin-top: 15px;
            padding: 15px;
            border-radius: 15px;
            background: rgba(0,0,0,0.05);
        }
    </style>
</head>
<body id="main-body">

    <audio id="pop-sound" src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3"></audio>
    <audio id="magic-sound" src="https://assets.mixkit.co/active_storage/sfx/2431/2431-preview.mp3"></audio>

    <div class="portal-container">
        <div id="time-icon" style="font-size: 3rem;">☀️</div>
        <h1 id="main-title">GÜNAYDIN NİSA ✨</h1>
        
        <div id="message-box" onclick="updatePortal()">Mesajın yükleniyor Nisa...</div>

        <div class="feature-box">
            <div id="daily-energy" style="font-size: 1.2rem; font-weight: bold;"></div>
            <div id="daily-music" style="margin-top: 10px; font-style: italic;"></div>
        </div>

        <div style="margin-top: 20px;">
            <p id="special-stat">Güzellik Katsayın: <span style="color:#ff4d6d">∞ %</span></p>
            <button class="refresh-btn" onclick="celebrate()">Nisa'yı Mutlu Et! 💖</button>
        </div>
    </div>

    <script>
        const isNight = new Date().getHours() >= 20 || new Date().getHours() < 6;
        const name = "Nisa";

        const dayMessages = [
            `Günaydın ${name}! Bugün senin kadar parlak olsun. ✨`,
            `${name}, bu sabah da çok muhteşemsin! 🌸`,
            `Güneş doğdu çünkü ${name} uyandı! ☀️`,
            `Kahven hazır değilse bile enerjin yeter ${name}! ☕`,
            `${name}, bugün harika işler başaracaksın. 💪`
        ];

        const nightMessages = [
            `İyi geceler ${name}, rüyaların büyüleyici olsun. 🌙`,
            `Yıldızlar bu gece ${name} için parlıyor. ✨`,
            `Dinlenmeyi hak ettin ${name}, tatlı rüyalar... 😴`,
            `${name}, bugünü harika kıldığın için teşekkürler. ❤️`,
            `Yarın yeni bir macera başlıyor ${name}. İyi uykular! 🌌`
        ];

        const daySongs = ["Lovely Day - Bill Withers", "Walking on Sunshine", "Happy - Pharrell"];
        const nightSongs = ["Lullaby - Brahms", "Night Ride - Kavinsky", "Moonlight Sonata"];

        function playSound(id) {
            const sound = document.getElementById(id);
            sound.currentTime = 0;
            sound.play();
        }

        function updatePortal() {
            playSound('pop-sound');
            const body = document.getElementById('main-body');
            const title = document.getElementById('main-title');
            const icon = document.getElementById('time-icon');
            const msgBox = document.getElementById('message-box');
            const musicBox = document.getElementById('daily-music');

            if (isNight) {
                body.className = "night-mode";
                title.innerText = `İYİ GECELER ${name.toUpperCase()} 🌙`;
                icon.innerText = "🌙";
                msgBox.innerText = nightMessages[Math.floor(Math.random() * nightMessages.length)];
                musicBox.innerHTML = `🌙 <b>Gece Şarkın:</b> ${nightSongs[Math.floor(Math.random() * nightSongs.length)]}`;
            } else {
                body.className = "day-mode";
                title.innerText = `GÜNAYDIN ${name.toUpperCase()} ✨`;
                icon.innerText = "☀️";
                msgBox.innerText = dayMessages[Math.floor(Math.random() * dayMessages.length)];
                musicBox.innerHTML = `🎵 <b>Günün Şarkısı:</b> ${daySongs[Math.floor(Math.random() * daySongs.length)]}`;
            }
            
            document.getElementById('daily-energy').innerText = `Enerji Seviyen: ${isNight ? 'Dinlenme Modu 💤' : 'Ultra Yüksek ⚡'}`;
        }

        function celebrate() {
            playSound('magic-sound');
            confetti({
                particleCount: 100,
                spread: 70,
                origin: { y: 0.6 },
                colors: isNight ? ['#bb86fc', '#03dac6', '#ffffff'] : ['#ff4d6d', '#ff9a9e', '#fad0c4']
            });
            updatePortal();
        }

        // Sayfa yüklendiğinde başlat
        window.onload = updatePortal;
    </script>
</body>
</html>
